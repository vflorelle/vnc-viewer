# Vérification des dépendances : `cargo deny check` (https://github.com/EmbarkStudios/cargo-deny).

[graph]
# Les plateformes visées : les dépendances des autres (macOS, Android…) ne sont pas vérifiées.
targets = ["x86_64-pc-windows-gnu", "x86_64-unknown-linux-gnu"]

[licenses]
# Licences permissives, compatibles avec MIT OR Apache-2.0. Une dépendance sous plusieurs
# licences au choix (« Apache-2.0 OR GPL-2.0-only »…) est acceptée si l'une d'elles l'est.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[advisories]
# Failles connues (base RustSec, téléchargée à chaque vérification).
yanked = "deny"
ignore = [
    # rsa 0.9 : temps de déchiffrement variable (attaque « Marvin »), qui demande des milliers de
    # déchiffrements avec la même clé. Ici la clé RSA du client est créée pour une seule
    # connexion et ne déchiffre qu'un seul message. Corrigé par rsa 0.10.
    { id = "RUSTSEC-2023-0071", reason = "clé RSA à usage unique, un seul déchiffrement par connexion" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Uniquement crates.io.
unknown-registry = "deny"
unknown-git = "deny"
